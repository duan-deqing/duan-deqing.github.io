# 技术栈页 /stack：页面文案、页头官网按钮与分类条目。
# buttons 控制页头介绍下方的按钮顺序、名称、链接与 logo；color 可选，不填使用默认强调色。
# 分类中的同名技术项会自动复用该链接。
# logo 可写 public/images/stack 下的文件名、站内路径或图片 URL。
page:
  title:
    en: Stack
    zh: 技术栈
  description:
    en: The tools and technologies I use to build AI products.
    zh: 我用来构建 AI 产品的工具与技术。
  intro:
    en: Tools I reach for when building and shipping.
    zh: 构建与交付时常用的工具。

