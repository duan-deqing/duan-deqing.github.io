# ═══════════════════════════════════════════════════════════
# 全站图标与技术项资源统一登记（icons.yaml）
#
# 其他 YAML 只写登记名，例如 logo: react / icon: orbit-desk / link: react，
# 不再写文件路径、链接或颜色。
#
# 字段说明：
#   file  — 图标文件路径（public/images/icons/<分类>/…），或完整 http(s) 图片地址；
#           只有 link 的纯链接条目可省略 file
#   link  — 官网或参考链接（技术项、按钮跳转地址）
#   color — 品牌色，用于按钮 hover 与技术项链接强调色
#
# 分类（与 public/images/icons/ 子目录一一对应）：
#   nav        导航            site.yaml navLinks
#   contacts   联系方式 / 品牌   site.yaml contacts、项目仓库按钮
#   stack      技术栈与工具      stack.yaml buttons / categories[].items / tags
#   hobbies    兴趣            stack.yaml 的 hobbies 分类
#   projects   项目            projects.yaml projects
#   bookmarks  书签分类         bookmarks.yaml categories
# ═══════════════════════════════════════════════════════════
icons:
