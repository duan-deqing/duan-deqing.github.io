<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="STYLAN site architecture diagram">
  <title>STYLAN 个人网站 · 页面结构图</title>
  <desc>从入口 main.jsx 到路由、布局壳层、首页分区与数据源的动态结构图。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0e1526"/>
    </linearGradient>
    <linearGradient id="nodeHome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132a3a"/>
      <stop offset="1" stop-color="#0f2230"/>
    </linearGradient>
    <linearGradient id="nodeRoute" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2340"/>
      <stop offset="1" stop-color="#141b31"/>
    </linearGradient>
    <linearGradient id="nodeData" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2136"/>
      <stop offset="1" stop-color="#1e1829"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .lbl   { fill:#e6edf3; font-size:15px; font-weight:600; }
      .sub   { fill:#8b98a9; font-size:11px; }
      .mono  { fill:#64ffda; font-size:11px; font-family:'SFMono-Regular',Consolas,monospace; }
      .kicker{ fill:#64ffda; font-size:11px; letter-spacing:2px; font-weight:700; }
      .h1    { fill:#e6edf3; font-size:26px; font-weight:700; letter-spacing:.5px; }
      .box   { stroke:#2b3a4d; stroke-width:1.2; }
      .link  { fill:none; stroke:#3a4a63; stroke-width:1.6; }
      .flow  { fill:none; stroke:#64ffda; stroke-width:2; stroke-linecap:round;
               stroke-dasharray:8 12; opacity:.85;
               animation: dash 1.4s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-40; } }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{ opacity:.35 } 50%{ opacity:.9 } }
      .rise  { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes rise { from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
      .dot   { fill:#64ffda; }
    </style>
  </defs>

  <rect width="1280" height="1000" fill="url(#bg)"/>

  <!-- header -->
  <g class="rise">
    <text x="48" y="56" class="kicker">STYLAN · SITE ARCHITECTURE</text>
    <text x="48" y="90" class="h1">页面结构图</text>
    <text x="48" y="114" class="sub">React 19 · Vite · React Router 7 · Tailwind 4 — 入口 → Provider → 布局壳 → 路由 → 分区 → 数据</text>
    <circle cx="1214" cy="70" r="6" class="dot pulse"/>
  </g>

  <!-- ================= connectors (under nodes) ================= -->
  <g>
    <!-- boot pipeline -->
    <path class="link" d="M185 208 V240"/><path class="flow" d="M185 208 V240"/>
    <path class="link" d="M185 310 V342"/><path class="flow" d="M185 310 V342" style="animation-delay:.15s"/>
    <path class="link" d="M185 412 V444"/><path class="flow" d="M185 412 V444" style="animation-delay:.3s"/>
    <path class="link" d="M185 514 V546"/><path class="flow" d="M185 514 V546" style="animation-delay:.45s"/>
    <!-- shell -> layouts -->
    <path class="link" d="M310 580 H370 V300 H430"/><path class="flow" d="M310 580 H370 V300 H430" style="animation-delay:.6s"/>
    <path class="link" d="M310 615 H400 V520 H430"/><path class="flow" d="M310 615 H400 V520 H430" style="animation-delay:.75s"/>
    <!-- layouts -> right panels -->
    <path class="link" d="M700 300 H770"/><path class="flow" d="M700 300 H770" style="animation-delay:.9s"/>
    <path class="link" d="M700 520 H725 V600 H770"/><path class="flow" d="M700 520 H725 V600 H770" style="animation-delay:1.05s"/>
    <!-- data feeds (dashed) -->
    <path class="link" d="M185 810 V650" stroke-dasharray="4 5"/>
    <path class="flow" d="M185 810 V650" style="animation-delay:1.2s" opacity=".5"/>
    <path class="link" d="M435 810 V775 H745" stroke-dasharray="4 5"/>
    <path class="link" d="M685 810 V775 H745" stroke-dasharray="4 5"/>
    <path class="link" d="M745 775 V700 H770" stroke-dasharray="4 5"/>
    <path class="flow" d="M745 775 V700 H770" style="animation-delay:1.35s" opacity=".5"/>
    <path class="link" d="M935 810 V770 H1050 V460 H895 V440" stroke-dasharray="4 5"/>
    <path class="flow" d="M935 810 V770 H1050 V460 H895 V440" style="animation-delay:1.5s" opacity=".5"/>
  </g>

  <!-- ================= LEFT: boot pipeline ================= -->
  <g class="rise" style="animation-delay:.1s">
    <rect x="60" y="160" width="250" height="48" rx="10" fill="url(#nodeRoute)" class="box"/>
    <text x="80" y="182" class="lbl">main.jsx</text>
    <text x="80" y="198" class="sub">createRoot · StrictMode · BrowserRouter</text>

    <rect x="60" y="240" width="250" height="70" rx="10" fill="url(#nodeRoute)" class="box"/>
    <text x="80" y="264" class="lbl">App</text>
    <text x="80" y="282" class="sub">顶层组件</text>
    <text x="80" y="298" class="mono">&lt;AppSettingsProvider&gt;</text>

    <rect x="60" y="342" width="250" height="70" rx="10" fill="url(#nodeData)" class="box"/>
    <text x="80" y="366" class="lbl">AppSettings (Context)</text>
    <text x="80" y="384" class="sub">useTheme · useLanguage · t()</text>
    <text x="80" y="400" class="mono">localStorage: theme / lang</text>

    <rect x="60" y="444" width="250" height="70" rx="10" fill="url(#nodeRoute)" class="box"/>
    <text x="80" y="468" class="lbl">Boot</text>
    <text x="80" y="486" class="sub">loading → leaving → ready</text>
    <text x="80" y="502" class="mono">Loading 进度条 + 首页 chunk 预取</text>

    <rect x="60" y="546" width="250" height="104" rx="10" fill="url(#nodeHome)" class="box" filter="url(#glow)"/>
    <text x="80" y="572" class="lbl">AppShell</text>
    <text x="80" y="592" class="sub">按 pathname 分流两种布局</text>
    <text x="80" y="612" class="mono">isHome ? 首页壳 : 子页壳</text>
    <text x="80" y="632" class="sub">ScrollToTop · Suspense fallback</text>
  </g>

  <!-- ================= MIDDLE: two layout shells ================= -->
  <g class="rise" style="animation-delay:.3s">
    <rect x="430" y="250" width="270" height="100" rx="10" fill="url(#nodeHome)" class="box"/>
    <text x="450" y="276" class="lbl">首页布局 · path="/"</text>
    <text x="450" y="296" class="sub">site-layout（Brittany 双栏）</text>
    <rect x="450" y="308" width="110" height="26" rx="6" fill="#0f2230" stroke="#2b3a4d"/>
    <text x="462" y="325" class="mono">SiteRail 左栏</text>
    <rect x="570" y="308" width="110" height="26" rx="6" fill="#0f2230" stroke="#2b3a4d"/>
    <text x="582" y="325" class="mono">main 右栏</text>

    <rect x="430" y="470" width="270" height="100" rx="10" fill="url(#nodeRoute)" class="box"/>
    <text x="450" y="496" class="lbl">子页布局 · 其它路由</text>
    <text x="450" y="516" class="sub">subpage-layout（顶栏 + 单栏）</text>
    <rect x="450" y="528" width="74" height="26" rx="6" fill="#141b31" stroke="#2b3a4d"/>
    <text x="460" y="545" class="mono">Header</text>
    <rect x="532" y="528" width="66" height="26" rx="6" fill="#141b31" stroke="#2b3a4d"/>
    <text x="546" y="545" class="mono">main</text>
    <rect x="606" y="528" width="74" height="26" rx="6" fill="#141b31" stroke="#2b3a4d"/>
    <text x="618" y="545" class="mono">footer</text>
  </g>

  <!-- ================= RIGHT-top: HomePage sections ================= -->
  <g class="rise" style="animation-delay:.5s">
    <text x="770" y="140" class="kicker">HOMEPAGE 分区</text>
    <rect x="770" y="150" width="250" height="290" rx="10" fill="#0d1424" class="box"/>
    <rect x="786" y="166" width="218" height="32" rx="6" fill="url(#nodeHome)" stroke="#2b3a4d"/>
    <text x="798" y="187" class="lbl" style="font-size:13px">MobileIntro</text>
    <text x="940" y="187" class="sub">移动端</text>
    <rect x="786" y="206" width="218" height="32" rx="6" fill="url(#nodeHome)" stroke="#2b3a4d"/>
    <text x="798" y="227" class="lbl" style="font-size:13px">About</text>
    <text x="972" y="227" class="sub">01</text>
    <rect x="786" y="246" width="218" height="32" rx="6" fill="url(#nodeHome)" stroke="#2b3a4d"/>
    <text x="798" y="267" class="lbl" style="font-size:13px">Projects</text>
    <text x="972" y="267" class="sub">02</text>
    <rect x="786" y="286" width="218" height="32" rx="6" fill="url(#nodeHome)" stroke="#2b3a4d"/>
    <text x="798" y="307" class="lbl" style="font-size:13px">BlogSection</text>
    <text x="972" y="307" class="sub">03</text>
    <rect x="786" y="326" width="218" height="32" rx="6" fill="url(#nodeHome)" stroke="#2b3a4d"/>
    <text x="798" y="347" class="lbl" style="font-size:13px">Skills</text>
    <text x="972" y="347" class="sub">04</text>
    <rect x="786" y="366" width="218" height="32" rx="6" fill="url(#nodeHome)" stroke="#2b3a4d"/>
    <text x="798" y="387" class="lbl" style="font-size:13px">Contact</text>
    <text x="972" y="387" class="sub">05</text>
    <text x="786" y="424" class="mono">全部包裹在 &lt;Reveal&gt; 滚动动画中</text>
  </g>

  <!-- ================= RIGHT-bottom: routes ================= -->
  <g class="rise" style="animation-delay:.7s">
    <text x="770" y="470" class="kicker">ROUTES 路由表</text>
    <rect x="770" y="480" width="250" height="250" rx="10" fill="#0d1424" class="box"/>
    <g font-size="12.5">
      <text x="788" y="508" class="mono">/            HomePage</text>
      <text x="788" y="536" class="mono">/skills      SkillsPage</text>
      <text x="788" y="564" class="mono">/projects    ProjectsPage</text>
      <text x="788" y="592" class="mono">/blog        BlogPage</text>
      <text x="788" y="620" class="mono">/blog/:slug  BlogPostPage</text>
      <text x="788" y="648" class="mono">/contact     ContactPage</text>
      <text x="788" y="676" class="mono">*            NotFoundPage</text>
    </g>
    <text x="788" y="712" class="sub">全部 lazy() 动态导入 · 子页后台预取</text>
  </g>

  <!-- ================= BOTTOM: data sources ================= -->
  <g class="rise" style="animation-delay:.9s">
    <text x="60" y="798" class="kicker">DATA 数据源</text>

    <rect x="70" y="810" width="230" height="76" rx="10" fill="url(#nodeData)" class="box"/>
    <text x="88" y="834" class="lbl">config.js</text>
    <text x="88" y="852" class="sub">navLinks · sections · social</text>
    <text x="88" y="868" class="mono">驱动导航 / 分区 / 文案</text>

    <rect x="320" y="810" width="230" height="76" rx="10" fill="url(#nodeData)" class="box"/>
    <text x="338" y="834" class="lbl">utils/markdown.js</text>
    <text x="338" y="852" class="sub">getAllPosts · getPostBySlug</text>
    <text x="338" y="868" class="mono">import.meta.glob → src/posts</text>

    <rect x="570" y="810" width="230" height="76" rx="10" fill="url(#nodeData)" class="box"/>
    <text x="588" y="834" class="lbl">blogConfig.js</text>
    <text x="588" y="852" class="sub">分类 · 标签 · 站点元信息</text>
    <text x="588" y="868" class="mono">供 Blog 列表 / 详情页</text>

    <rect x="820" y="810" width="230" height="76" rx="10" fill="url(#nodeData)" class="box"/>
    <text x="838" y="834" class="lbl">src/posts/**.md</text>
    <text x="838" y="852" class="sub">zh / en 双语文章 + img</text>
    <text x="838" y="868" class="mono">front-matter 元数据</text>

    <rect x="1070" y="810" width="150" height="76" rx="10" fill="url(#nodeData)" class="box"/>
    <text x="1086" y="834" class="lbl">build 产物</text>
    <text x="1086" y="852" class="sub">generate-rss.js</text>
    <text x="1086" y="868" class="mono">public/rss.xml</text>
  </g>

  <!-- legend -->
  <g class="rise" style="animation-delay:1.1s">
    <rect x="60" y="916" width="1160" height="64" rx="10" fill="#0c1220" stroke="#22303f"/>
    <text x="82" y="942" class="kicker">LEGEND</text>
    <circle cx="90" cy="960" r="6" fill="url(#nodeHome)" stroke="#64ffda"/>
    <text x="104" y="964" class="sub">首页布局 / 分区</text>
    <circle cx="240" cy="960" r="6" fill="url(#nodeRoute)" stroke="#3a4a63"/>
    <text x="254" y="964" class="sub">启动管线 / 路由</text>
    <circle cx="390" cy="960" r="6" fill="url(#nodeData)" stroke="#3a4a63"/>
    <text x="404" y="964" class="sub">数据源 / Context</text>
    <line x1="540" y1="960" x2="580" y2="960" stroke="#64ffda" stroke-width="2" stroke-dasharray="8 12"/>
    <text x="590" y="964" class="sub">数据 / 渲染流向</text>
    <line x1="720" y1="960" x2="760" y2="960" stroke="#3a4a63" stroke-width="1.6" stroke-dasharray="4 5"/>
    <text x="770" y="964" class="sub">配置注入</text>
    <text x="880" y="964" class="sub">主题色 #64ffda · 深/浅双主题 token 驱动</text>
  </g>
</svg>
