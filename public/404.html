<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STYLAN</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --bg: #fafaf9;
        --ink: #18181b;
        --muted: #71717a;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0e10;
          --ink: #ececee;
          --muted: #a1a1aa;
          --accent: #60a5fa;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC",
          "Microsoft YaHei", "Noto Sans SC", sans-serif;
      }
      .wrap { padding: 2rem; text-align: center; }
      .logo { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
      .rule { width: 2.5rem; height: 1px; margin: 1rem auto; background: var(--accent); }
      p { margin: 0; color: var(--muted); font-size: 0.875rem; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">STYLAN</div>
      <div class="rule"></div>
      <p>Redirecting…</p>
      <noscript><p><a href="/">Open STYLAN</a></p></noscript>
    </div>
    <script>
      (function () {
        var l = window.location;
        var segmentsToKeep = 0;
        var redirectUrl =
          l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + segmentsToKeep).join("/") + "/?/" +
          l.pathname.slice(1).split("/").slice(segmentsToKeep).join("/").replace(/&/g, "~and~") +
          l.search.slice(1).replace(/&/g, "~and~") +
          l.hash;
        window.location.replace(redirectUrl);
      })();
    </script>
  </body>
</html>
