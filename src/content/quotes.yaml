# 博客 / 书签空态随机语录；每条包含中英文，保持通俗但有分量
quotes:
  - en: "You don't have to see the whole path. Take the next honest step."
    zh: "你不必看清整条路，先走好眼前诚实的一步。"
  - en: "Consistency is quieter than motivation, and it lasts longer."
    zh: "坚持比热情安静，却走得更远。"
  - en: "Small work done today beats perfect work imagined forever."
    zh: "今天完成的一小步，胜过永远想象里的完美。"
  - en: "Rest is part of the rhythm, not a break from it."
    zh: "休息也是节奏的一部分，而不是节奏之外。"
  - en: "What you repeat in private becomes who you are in public."
    zh: "你在无人处反复做的事，会变成人前的你。"
  - en: "Direction matters more than speed. Keep walking."
    zh: "方向比速度重要，继续走就好。"
  - en: "The best time to begin is usually the moment you stop waiting."
    zh: "开始的最好时机，往往是你停止等待的那一刻。"
  - en: "A clear mind is built by finishing things, not by starting more."
    zh: "清醒来自把事情做完，而不是不断开始。"
  - en: "A new life is built by new days, not by one dramatic decision."
    zh: "新生活由一个个新的日子建成，而不是一次戏剧性的决定。"
  - en: "The mountain doesn't move, but the view changes with every step."
    zh: "山不会移动，但每走一步，风景都会不同。"
  - en: "Doubt is not a sign to stop; it's a sign you're thinking."
    zh: "怀疑不是停下的信号，而是你正在思考的证明。"
  - en: "You grow in the places you stop avoiding."
    zh: "你真正成长的地方，往往是你不再逃避的地方。"
  - en: "Slow progress is still progress. Standing still is the only real pause."
    zh: "慢一点也是前进，原地不动才是真正的暂停。"
  - en: "Make room for the work that makes you feel alive."
    zh: "给那些让你觉得活着的工作留出空间。"
  - en: "The work you do today is a message to the person you're becoming."
    zh: "你今天做的事，是写给未来自己的信。"
  - en: "Clarity comes from action, not before it."
    zh: "清晰来自行动，而不是行动之前。"
